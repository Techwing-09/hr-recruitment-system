<div class="login-container">

    <div class="login-card">

        <h2>HR Login</h2>

        <p>Login to manage recruitment activities.</p>

        <form>

            <label>Email</label>
            <input
            type="email"
            placeholder="Enter Email">

            <label>Password</label>
            <input
            type="password"
            placeholder="Enter Password">

            <button type="submit">
                Login
            </button>

        </form>

        <div class="links">

            <a routerLink="/hr-signup">
                Create New Account
            </a>

            <a href="#">
                Forgot Password?
            </a>

        </div>

    </div>

</div>
