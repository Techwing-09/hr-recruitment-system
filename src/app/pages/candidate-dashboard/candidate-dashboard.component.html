<div class="dashboard-container">

    <!-- Sidebar -->
    <app-candidate-sidebar></app-candidate-sidebar>

    <!-- Main Content -->
    <div class="main-content">

        <h1>Candidate Dashboard</h1>

        

        <!-- Dashboard Cards -->
        <div class="dashboard-cards">

            <!-- Available Jobs -->
            <div class="card">
                <h2>Available Jobs</h2>
                <h1>{{ dashboard.availableJobs }}</h1>
            </div>

            <!-- Applied Jobs -->
            <div class="card">
                <h2>Applied Jobs</h2>
                <h1>{{ dashboard.appliedJobs }}</h1>
            </div>

            <!-- Interview Invitations -->
            <div class="card">
                <h2>Interview Invitations</h2>
                <h1>{{ dashboard.interviewInvitations }}</h1>
            </div>

        </div>

        <!-- Quick Actions -->
        <div class="quick-actions">

            <h2>Quick Actions</h2>

            <button routerLink="/candidate/jobs">
                View Available Jobs
            </button>

            <button routerLink="/candidate/applications">
                My Applications
            </button>

        </div>

    </div>

</div>
