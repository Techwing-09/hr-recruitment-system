<app-hr-sidebar></app-hr-sidebar>

<div class="candidate-container">

    <h1>Candidates</h1>

    <table>

        <thead>

            <tr>
                <th>Candidate Name</th>
                <th>Email</th>
                <th>Applied Job</th>
                <th>Resume</th>
                <th>Match Score</th>
                <th>Interview Status</th>
            </tr>

        </thead>

        <tbody>

            <tr *ngFor="let candidate of candidates">

                <td>{{ candidate.candidateName }}</td>

                <td>{{ candidate.email }}</td>

                <td>{{ candidate.jobTitle }}</td>

                <td>
                    <button
                        class="resume-btn"
                        (click)="viewResume(candidate.candidateId)">
                        View Resume
                    </button>
                </td>

                <td>{{ candidate.matchScore }}%</td>

                <td>{{ candidate.interviewStatus }}</td>

            </tr>

            <tr *ngIf="candidates.length == 0">

                <td colspan="6" style="text-align:center;">
                    No Candidates Found
                </td>

            </tr>

        </tbody>

    </table>

</div>
