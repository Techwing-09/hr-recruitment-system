<app-candidate-sidebar></app-candidate-sidebar>

<div class="profile-container">

    <div class="profile-card">

        <h2>Candidate Profile</h2>

        <div class="profile-image">
            <img src="https://cdn-icons-png.flaticon.com/512/3135/3135715.png"
                 alt="Candidate">
        </div>

        <div class="profile-details">

            <!-- Full Name -->
            <div class="row">
                <label>Full Name</label>

                <span *ngIf="!isEditMode">
                    {{candidate.candidateName}}
                </span>

                <input
                    *ngIf="isEditMode"
                    type="text"
                    [(ngModel)]="candidate.candidateName">
            </div>

            <!-- Email -->
            <div class="row">
                <label>Email</label>

                <span *ngIf="!isEditMode">
                    {{candidate.email}}
                </span>

                <input
                    *ngIf="isEditMode"
                    type="email"
                    [(ngModel)]="candidate.email">
            </div>

            <!-- Phone -->
            <div class="row">
                <label>Phone Number</label>

                <span *ngIf="!isEditMode">
                    {{candidate.phone}}
                </span>

                <input
                    *ngIf="isEditMode"
                    type="text"
                    [(ngModel)]="candidate.phone">
            </div>

            <!-- Qualification -->
            <div class="row">
                <label>Qualification</label>

                <span *ngIf="!isEditMode">
                    {{candidate.qualification}}
                </span>

                <input
                    *ngIf="isEditMode"
                    type="text"
                    [(ngModel)]="candidate.qualification">
            </div>

            <!-- Skills -->
            <div class="row">
                <label>Skills</label>

                <span *ngIf="!isEditMode">
                    {{candidate.skills}}
                </span>

                <input
                    *ngIf="isEditMode"
                    type="text"
                    [(ngModel)]="candidate.skills">
            </div>

            <!-- Experience -->
            <div class="row">
                <label>Experience</label>

                <span *ngIf="!isEditMode">
                    {{candidate.experience}}
                </span>

                <input
                    *ngIf="isEditMode"
                    type="text"
                    [(ngModel)]="candidate.experience">
            </div>

            <!-- Address -->
            <div class="row">
                <label>Address</label>

                <span *ngIf="!isEditMode">
                    {{candidate.address}}
                </span>

                <input
                    *ngIf="isEditMode"
                    type="text"
                    [(ngModel)]="candidate.address">
            </div>

        </div>

        <div class="buttons">

            <button
                *ngIf="!isEditMode"
                class="edit-btn"
                (click)="editProfile()">
                Edit Profile
            </button>

            <button
                *ngIf="isEditMode"
                class="edit-btn"
                (click)="updateProfile()">
                Update Profile
            </button>

        </div>

    </div>

</div>
